<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" fill="none">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#fbf7ee"/><stop offset="1" stop-color="#efe4d2"/>
  </linearGradient>
  <radialGradient id="glow" cx="50%" cy="38%" r="62%">
    <stop offset="0" stop-color="#ffffff" stop-opacity=".85"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
  </radialGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
    <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#4a3826" flood-opacity=".18"/>
  </filter>
  <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="6"/>
  </filter>
  <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1.1" fill="#8f7655" opacity=".16"/>
  </pattern>
</defs>
<rect width="640" height="420" fill="url(#bg)"/>
<rect width="640" height="420" fill="url(#dots)"/>
<rect width="640" height="420" fill="url(#glow)"/>
