<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" fill="none">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#f6efe1"/><stop offset="1" stop-color="#e8d9c1"/>
  </linearGradient>
  <radialGradient id="glow" cx="50%" cy="38%" r="62%">
    <stop offset="0" stop-color="#ffffff" stop-opacity=".85"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
  </radialGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
    <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#4a3826" flood-opacity=".18"/>
  </filter>
  <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="6"/>
  </filter>
  <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1.1" fill="#8f7655" opacity=".16"/>
  </pattern>
</defs>
<rect width="1200" height="800" fill="url(#bg)"/>
<rect width="1200" height="800" fill="url(#dots)"/>
<rect width="1200" height="800" fill="url(#glow)"/>
<circle cx="880" cy="300" r="300" fill="#b98a58" opacity=".08"/><path d="M0 620 C300 560 520 700 800 620 C1000 565 1120 610 1200 580" stroke="#b98a58" stroke-opacity=".18" stroke-width="2" fill="none"/><text x="80" y="120" font-family="SFMono-Regular, Menlo, monospace" font-size="11" fill="#a08a6b" letter-spacing="4">SMALL BATCH PRINTING / SINCE 2026</text></svg>